name: Windows portable build and release
run-name: Windows build ${{ inputs.version || github.ref_name }}
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 8.0.1); blank uses the source version for a build-only run'
        type: string
        required: false
      publish:
        description: 'Publish a new portable release after all checks pass (requires a new version)'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}-${{ inputs.version || 'auto' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 20
    outputs:
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Select and validate version
        id: version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          MANUAL_PUBLISH: ${{ inputs.publish }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Tags must use vMAJOR.MINOR.PATCH.' }
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } elseif ($env:REQUESTED_VERSION) {
            $version = $env:REQUESTED_VERSION
          } else {
            if ($env:MANUAL_PUBLISH -eq 'true') { throw 'Enter an unused version when publishing manually.' }
            $text = Get-Content Source/NightLens.cs -Raw
            $match = [regex]::Match($text, 'AssemblyFileVersion\("([0-9]+\.[0-9]+\.[0-9]+)\.[0-9]+"\)')
            if (!$match.Success) { throw 'Could not read source version.' }
            $version = $match.Groups[1].Value
          }
          if ($version -notmatch '^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw 'Version must be MAJOR.MINOR.PATCH.' }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Build Windows app and run offline checks
        run: ./Source/Build.ps1 -Version '${{ steps.version.outputs.version }}' -Verify
      - name: Package and verify portable ZIP
        run: ./Scripts/Package-Portable.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Save verified portable build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: NightLens-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/NightLens-Windows11-v*.zip
            dist/SHA256SUMS.txt
            dist/build-metadata.json
          if-no-files-found: error
          retention-days: 14
  publish:
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download checked portable build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: NightLens-Windows-${{ needs.build.outputs.version }}
          path: dist
      - name: Publish release with verified assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./Scripts/Publish-Release.ps1 -ArtifactDirectory dist
